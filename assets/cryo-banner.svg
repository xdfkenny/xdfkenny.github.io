<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="xdfkenny - Cryo exorcist developer banner">
  <defs>
    <!-- Cryo ice gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="40%" stop-color="#13264a"/>
      <stop offset="100%" stop-color="#1a4d6e"/>
    </linearGradient>

    <!-- Frost glow filter -->
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Snowflake shape -->
    <path id="flake" fill="#a5f2f3" d="M0-3 L0.5-1 L3-1 L1-0.5 L2 2 L0 1 L-2 2 L-1-0.5 L-3-1 L-0.5-1 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#00f0ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Cryo vision symbol (abstract) -->
  <g transform="translate(880, 150)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00f0ff" stroke-width="2">
      <animate attributeName="r" values="70;85;70" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#a5f2f3" stroke-width="2">
      <animate attributeName="r" values="50;65;50" dur="5s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Snowflakes -->
  <g>
    <use href="#flake" x="100" y="-20" opacity="0.6">
      <animate attributeName="y" values="-20;320" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;130;100" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 0" to="360 100 0" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="250" y="-50" opacity="0.4" transform="scale(1.2)">
      <animate attributeName="y" values="-50;320" dur="10s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="x" values="250;220;250" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="450" y="-30" opacity="0.7">
      <animate attributeName="y" values="-30;320" dur="9s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="x" values="450;470;450" dur="5s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="650" y="-40" opacity="0.5" transform="scale(0.8)">
      <animate attributeName="y" values="-40;320" dur="11s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="x" values="650;620;650" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="800" y="-60" opacity="0.6" transform="scale(1.1)">
      <animate attributeName="y" values="-60;320" dur="7s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="x" values="800;830;800" dur="6s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="50" y="-80" opacity="0.3">
      <animate attributeName="y" values="-80;320" dur="12s" repeatCount="indefinite" begin="4s"/>
    </use>
    <use href="#flake" x="920" y="-10" opacity="0.5" transform="scale(0.9)">
      <animate attributeName="y" values="-10;320" dur="9s" repeatCount="indefinite" begin="2.5s"/>
    </use>
    <use href="#flake" x="350" y="-70" opacity="0.4">
      <animate attributeName="y" values="-70;320" dur="13s" repeatCount="indefinite" begin="5s"/>
    </use>
  </g>

  <!-- Main text -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="115" font-size="62" font-weight="800" fill="#f0f8ff" letter-spacing="4" filter="url(#frost)">
      xdfkenny
    </text>
    <text x="500" y="115" font-size="62" font-weight="800" fill="url(#bg)" fill-opacity="0" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" letter-spacing="4">
      xdfkenny
    </text>
    <text x="500" y="165" font-size="22" fill="#a5f2f3" letter-spacing="2" opacity="0.95">
      ❄️ Exorcising bugs with Cryo code ❄️
    </text>
  </g>

  <!-- Frost divider line -->
  <line x1="200" y1="210" x2="800" y2="210" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Tagline -->
  <text x="500" y="250" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#87ceeb" letter-spacing="1" opacity="0.85">
    IB DP Student • Full-stack Developer • Vibe Coder
  </text>
</svg>
